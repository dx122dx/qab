# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Fabric Loom 镜像配置由 build.gradle 的 ext 块按 useBmclapi 条件设置：
# CI（GitHub Actions）环境直连 Mojang，避免镜像 SHA1 漂移导致构建失败。

# Mod Properties
mod_version=1.0.0-dev-20260817.3
maven_group=io.github.dx122dx.mc
archives_base_name=qshop-auto-buy

# Dependencies
fabric_api_version=0.92.11+1.20.1

# Chunk Scanner dependency — 读取 QShop 扫描数据
chunkscanner_group=io.github.dx122dx.mc
chunkscanner_artifact=chunkscanner
chunkscanner_default_version=2.0.0-SNAPSHOT

# Infrastructure dependency — 复用通用渲染器（BoxRenderer 等）
infrastructure_group=io.github.dx122dx.mc
infrastructure_artifact=infrastructure
infrastructure_default_version=0.1.0-SNAPSHOT

# schematic4j — 解析 .litematic/.schem/.schematic 原理图
schematic4j_version=1.1.0

# Cloth Config / AutoConfig — 配置持久化与 GUI（与 chunkscanner 同版本）
cloth_config_version=11.1.106
