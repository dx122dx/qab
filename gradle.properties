# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Fabric Loom 镜像配置（将 Mojang 库链接重定向至 BMCLAPI 镜像）
fabric.loom.libraries_base=https://bmclapi2.bangbang93.com/libraries/
fabric.loom.resources_base=https://bmclapi2.bangbang93.com/assets/
fabric.loom.manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json

# Mod Properties
mod_version=1.0.0-dev-20260803.2
maven_group=com.billy65536.qab

# Dependencies
fabric_api_version=0.92.11+1.20.1

# Chunk Scanner dependency — 读取 QShop 扫描数据
# 通过 IChunkDb.FactoryRegistry 工厂模式加载，不硬编码 BinaryChunkDb
chunkscanner_group=com.billy65536
chunkscanner_artifact=chunkscanner
chunkscanner_version=1.1.0-dev-20260802.4

# schematic4j — 解析 .litematic/.schem/.schematic 原理图
schematic4j_version=1.1.0
