plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

// Fabric Loom 镜像配置（为无法直连 Mojang 服务器的环境使用 BMCLAPI 镜像）
ext {
    loom_version_manifests = 'https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json'
    loom_libraries_base = 'https://bmclapi2.bangbang93.com/libraries/'
    loom_resources_base = 'https://bmclapi2.bangbang93.com/assets/'
}

loom {
    // 使用 BMCLAPI 直接下载版本 JSON，绕过 version manifest
    customMinecraftManifest = 'https://bmclapi2.bangbang93.com/v1/packages/a540b5c5ded34de717f3acc10c9d3704b66670d8/1.20.1.json'
}

repositories {
    maven {
        name = 'BMCLAPI Minecraft Libraries'
        url = 'https://bmclapi2.bangbang93.com/libraries/'
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    mavenCentral()
	// Chunk Scanner SNAPSHOT 制品发布到中央快照仓库（需此仓库才能解析 -SNAPSHOT 版本）
	maven {
		name = 'Maven Central Snapshots'
		url = 'https://central.sonatype.com/repository/maven-snapshots/'
	}
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Chunk Scanner — 读取 QShop 扫描数据（client 端），从 Maven Central SNAPSHOT 拉取
    // 通过 IChunkDb.FactoryRegistry 工厂模式加载，不硬编码 BinaryChunkDb
    modImplementation "${project.chunkscanner_group}:${project.chunkscanner_artifact}:${project.chunkscanner_default_version}"

    // schematic4j — 解析 .litematic / .schem / .schematic 原理图，用于生成购物清单
    // 普通 Java 库（非 mod），需 include 打进最终 jar
    implementation "net.sandrohc:schematic4j:${project.schematic4j_version}"
    include "net.sandrohc:schematic4j:${project.schematic4j_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version,
		       "chunkscanner_version": project.chunkscanner_default_version
	}
}

tasks.withType(JavaCompile).configureEach {
    it.options.compilerArgs.addAll(['--release', '17'])
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName"}
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
