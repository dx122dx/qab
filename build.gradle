plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// CI（GitHub Actions）环境可直连 Mojang，自动跳过 BMCLAPI 镜像，
// 避免镜像 SHA1 漂移导致 CI 构建失败；仅本地无法直连时使用镜像。
def useBmclapi = System.getenv("CI") == null

// Fabric Loom 镜像配置（为无法直连 Mojang 服务器的环境使用 BMCLAPI 镜像）
if (useBmclapi) {
    ext {
        loom_version_manifests = 'https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json'
        loom_libraries_base = 'https://bmclapi2.bangbang93.com/libraries/'
        loom_resources_base = 'https://bmclapi2.bangbang93.com/assets/'
    }
}

loom {
    // 使用 BMCLAPI 直接下载版本 JSON，绕过 version manifest
    // 注意：SHA1 前缀可能随 BMCLAPI 更新而变化，若构建失败请检查此 URL
    if (useBmclapi) {
        customMinecraftManifest = 'https://bmclapi2.bangbang93.com/v1/packages/a540b5c5ded34de717f3acc10c9d3704b66670d8/1.20.1.json'
    }
}

repositories {
    mavenLocal()
    if (useBmclapi) {
        maven {
            name = 'BMCLAPI Minecraft Libraries'
            url = 'https://bmclapi2.bangbang93.com/libraries/'
        }
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    mavenCentral()
	// Chunk Scanner SNAPSHOT 制品发布到中央快照仓库（需此仓库才能解析 -SNAPSHOT 版本）
	maven {
		name = 'Maven Central Snapshots'
		url = 'https://central.sonatype.com/repository/maven-snapshots/'
	}
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Chunk Scanner — 读取 QShop 扫描数据（client 端），从 Maven Central SNAPSHOT 拉取
    // 通过 IChunkDb.FactoryRegistry 工厂模式加载，不硬编码 BinaryChunkDb
    // changing=true 确保始终拉取最新 chunkscanner SNAPSHOT（强制更新依赖版本）
    modImplementation("${project.chunkscanner_group}:${project.chunkscanner_artifact}:${project.chunkscanner_default_version}") {
        changing = true
    }

    // Infrastructure — 复用通用渲染器（BoxRenderer / Box），同样从 SNAPSHOT 拉取
    modImplementation("${project.infrastructure_group}:${project.infrastructure_artifact}:${project.infrastructure_default_version}") {
        changing = true
    }

    // schematic4j — 解析 .litematic / .schem / .schematic 原理图，用于生成购物清单
    // 普通 Java 库（非 mod），需 include 打进最终 jar
    implementation "net.sandrohc:schematic4j:${project.schematic4j_version}"
    include "net.sandrohc:schematic4j:${project.schematic4j_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version,
		       "chunkscanner_version": project.chunkscanner_default_version,
		       "infrastructure_version": project.infrastructure_default_version
	}
}

tasks.withType(JavaCompile).configureEach {
    it.options.compilerArgs.addAll(['--release', '17'])
}

java {
    withSourcesJar()
    withJavadocJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Maven Central 快照发布要求禁用 Gradle Module Metadata，
// 避免 .module 文件泄漏对 SNAPSHOT 依赖（chunkscanner）的坐标。
tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

// javadoc 对源码注释较严格（已有注释存在格式/链接问题），
// 关闭 doclint 仅生成告警，避免阻塞 build / 发布。
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    (options as StandardJavadocDocletOptions).addBooleanOption('Xdoclint:none', true)
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName"}
    }
}

// maven-publish 配置：坐标与快照仓库全部由外部属性/环境变量驱动，
// 属性缺省时回落到现有 group/version，本地 ./gradlew build 行为完全不变。
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            // 发布坐标覆盖契约：CI 传 -PpublishGroup / -PpublishVersion，缺省回落到现有值
            groupId    = findProperty('publishGroup')   ?: project.group
            artifactId = project.archives_base_name
            version    = findProperty('publishVersion') ?: project.version

            pom {
                name        = 'QShop Auto Buy'
                description = 'Client-side QShop automatic buying helper for Fabric. Parses schematics into shopping lists, plans purchases against QShop store data and auto-navigates to each shop. NOTE: this mod requires the "chunkscanner" mod (io.github.dx122dx.mc:chunkscanner) at runtime, published to Maven Central.'
                url         = 'https://github.com/dx122dx/qab'
                licenses {
                    license {
                        name = 'GNU Affero General Public License v3.0 only'
                        url  = 'https://www.gnu.org/licenses/agpl-3.0.txt'
                    }
                }
                developers {
                    developer {
                        id   = 'billy65536'
                        name = 'billy65536'
                    }
                }
                scm {
                    connection          = 'scm:git:git://github.com/dx122dx/qab.git'
                    developerConnection = 'scm:git:ssh://github.com/dx122dx/qab.git'
                    url                 = 'https://github.com/dx122dx/qab'
                }

                // 依赖均可从公共 Maven 解析（chunkscanner 已发布到中央 SNAPSHOT），无需剔除本地坐标。
            }
        }
    }

    repositories {
        maven {
            name = 'centralSnapshots'
            url  = 'https://central.sonatype.com/repository/maven-snapshots/'
            credentials {
                username = System.getenv('CENTRAL_TOKEN_USERNAME')
                password = System.getenv('CENTRAL_TOKEN_PASSWORD')
            }
        }
    }
}
