name: Publish

# 推送 git tag（形如 v1.0.0 / v1.0.0-dev / v1.0.0-beta.1）时自动构建并发布到
# GitHub Release 与 Modrinth。版本号以 tag 为唯一真相源，CI 注入
# gradle.properties 后构建，changelog 由提交历史生成。
# qab 依赖的 chunkscanner 已发布到 Maven Central（SNAPSHOT），无需本地 checkout/build。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: 'Minecraft mod publish'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Derive version & channel from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"          # 例如 v1.0.0 / v1.0.0-dev
          VERSION="${TAG#v}"                # 去掉前缀 v -> 1.0.0
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *alpha* || "$TAG" == *dev* ]]; then VT=alpha
          elif [[ "$TAG" == *beta* || "$TAG" == *rc* ]]; then VT=beta
          else VT=release; fi
          echo "version_type=$VT" >> "$GITHUB_OUTPUT"

      - name: Apply version to gradle.properties
        run: sed -i "s/^mod_version=.*/mod_version=${{ steps.meta.outputs.version }}/" gradle.properties

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Generate changelog from commits
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            git log --no-merges --pretty=format:"- %s (%h)" "$PREV..HEAD" > changelog_gen.md
          else
            git log --no-merges --pretty=format:"- %s (%h)" > changelog_gen.md
          fi

      - name: Publish to Modrinth & GitHub Release
        uses: Kira-NT/mc-publish@v3.3.0
        with:
          # Modrinth —— 需在仓库 Settings > Secrets and variables 配置：
          #   vars.MODRINTH_ID       = Modrinth 项目 slug 或 id
          #   secrets.MODRINTH_TOKEN = Modrinth API Token
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          name: QShop Auto Buy ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.tag }}
          version-type: ${{ steps.meta.outputs.version_type }}

          game-versions: "1.20.1"
          loaders: fabric
          changelog-file: changelog_gen.md

          files: build/libs/!(*-sources).jar
